# Test environment, not a deployment. The database is empty until a producer — or
# `docs/tutorial.md` — writes a row; the schema comes from `edutap-dbdef`, never from
# this service.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: data_provider
      POSTGRES_PASSWORD: data_provider
      POSTGRES_DB: data_provider
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_provider"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      EDUTAP_DATA_PROVIDER_DATABASE_URL: postgresql+asyncpg://data_provider:data_provider@db/data_provider
      EDUTAP_DATA_PROVIDER_CONFIG_PATH: /app/views.yaml
      EDUTAP_DATA_PROVIDER_API_TOKEN: ${EDUTAP_DATA_PROVIDER_API_TOKEN:-dev-token}
      # Optional; unset in the test environment, so nothing is reported anywhere.
      EDUTAP_DATA_PROVIDER_SENTRY_DSN: ${EDUTAP_DATA_PROVIDER_SENTRY_DSN:-}
      EDUTAP_DATA_PROVIDER_OTLP_ENDPOINT: ${EDUTAP_DATA_PROVIDER_OTLP_ENDPOINT:-}
      EDUTAP_DATA_PROVIDER_ENVIRONMENT: development
    volumes:
      - ./views.example.yaml:/app/views.yaml:ro
    ports: ["8000:8000"]
