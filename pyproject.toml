[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.data_provider"
version = "0.1.0"
description = "Read-only service delivering person views and pass states for eduTAP"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    # The ninth runtime dependency, which the design record requires a written reason
    # for. A service that answers a deliberately opaque 500 -- opaque because the
    # blanket handler must not leak stored data -- has no diagnosable failure without
    # an error tracker. Making it an extra would mean the one configuration that
    # makes failures visible is the one nobody installs.
    "sentry-sdk[fastapi]>=2.66",
    # The tenth runtime dependency; same reason as the ninth. The [fastapi] extra is
    # not cosmetic: `logfire.instrument_fastapi()` raises at runtime without
    # `opentelemetry-instrumentation-fastapi`, which only that extra pulls in.
    "logfire[fastapi]>=4.39",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    # PEP 508 direct reference, not a bare name: edutap.db_definitions is public
    # but not published to PyPI. A direct reference resolves the same way whether
    # this extra is installed alone (`make venv`, a fresh clone) or after the
    # package itself, so there is no required install ordering — unlike a
    # separate `pip install` step run before `-e ".[dev]"` in CI.
    "edutap.db_definitions @ git+https://github.com/edutap-collective/edutap.db_definitions@main",
    # Never imported by this package. `fastapi.testclient` needs an HTTP client, and
    # starlette 1.3 takes `httpx2` in preference to `httpx`, warning whenever it has
    # to fall back to the latter. Listing it here is what keeps that fallback — and
    # its deprecation warning — out of the test run.
    "httpx2>=2.9",
    # Mutation testing, run by hand rather than in CI — see [tool.mutmut] below for
    # what it is here to answer. Not in the default `make test-local` path: it runs
    # the suite once per mutant, which is minutes rather than the second the suite
    # itself takes.
    "mutmut>=3.7",
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
    "testcontainers[postgres]>=4.8",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[project.entry-points."edutap.db_definitions"]
schema = "edutap.data_provider.models.dbdef:definition"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.hatch.metadata]
# Required by hatchling for the `edutap.db_definitions` direct reference (a git URL,
# not a PyPI name) in the `dev` extra above. This package is never published to
# PyPI itself, so the restriction direct references normally exist to enforce there
# does not apply.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL container",
    "slow: exercises real elapsed time (subprocess timing), seconds not milliseconds",
]
addopts = "-m 'not integration and not slow'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
# S106: bandit's hardcoded-password heuristic flags this file's two `PassState(...)`
# keyword arguments (`pass_id=`, `pass_template=`) because their underscore-separated
# words include "pass" — they are wallet-pass fields, not passwords. Scoped to this
# one file, not all tests, so the check still applies to test code elsewhere.
"tests/test_models.py" = ["S106"]

[tool.mutmut]
# Mutation testing answers the one question this package's test suite has got wrong
# four times: not "does a test cover this line?" but "would any test notice if this
# line changed?" Every one of those four was a test that was green for a reason
# other than the one its name claimed — a mapper keyed on a parameter name that the
# real application never uses, a bound-shutdown guard whose probe process could die
# in a hundredth of a second and still satisfy it. A surviving mutant is exactly
# that shape, found mechanically instead of by someone happening to look.
#
# The whole package, not a single file: mutmut copies the project into `mutants/`
# and runs there, and a single-file target leaves the namespace package incomplete
# ("No module named 'edutap.data_provider.api'").
#
# One trap worth knowing before reading a result: mutmut keys its verdicts on the
# source it mutated, so adding a test to kill a survivor does not invalidate them.
# A second run then finishes in 3 seconds instead of 47 and reports the identical
# numbers while the survivors are in fact dead. Removing `mutants/mutmut-stats.json`
# is not enough — the state lives in the whole `mutants/` tree, which is why
# `make test-mutation` removes the directory rather than the file.
source_paths = ["src/edutap/data_provider/"]
# Anything the tests read from the repository root has to travel to that copy too.
# `tests/test_docs.py` resolves ROOT as the parent of `tests/` and reads the
# documentation set, the README and the example configuration from it; without this
# they error in every mutant run and the results are noise rather than findings.
also_copy = ["docs/", "README.md", "views.example.yaml"]
