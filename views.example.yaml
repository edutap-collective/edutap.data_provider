# Example view configuration for edutap.data_provider.
#
# The path to this file is `EDUTAP_DATA_PROVIDER_CONFIG_PATH`. It is read once at
# startup and validated there; every problem below is fatal before the first request.

constants:
  # LMU writes an unlimited role as this date rather than as a missing value.
  # Another site may use a different sentinel — it is configuration, not a constant
  # of the package.
  open_ended: 9999-12-31
  # A value that is the same for every person is a constant, not a field: a field
  # would say a producer writes it per person, and nobody does.
  home_organization: example.edu

views:
  full_view:
    description: Complete person record as the producer writes it
    fields:
      eduperson_principal_name: [STRING, TEXT, NFC]
      given_name: [STRING, TEXT]
      surname: [STRING, TEXT]
      mail: [STRING, TEXT, LINK]
      eduperson_affiliation: [STRING, TEXT]

  mensapass:
    description: What the canteen pass needs
    fields:
      eduperson_principal_name: [STRING, TEXT, NFC]
      display_name: [STRING, TEXT]
      student_role_valid_until: [STRING, DATETIME]
      employee_role_valid_until: [STRING, DATETIME]
    derived:
      pass_valid_until:
        kinds: [STRING, TEXT, DATETIME]
        description: At most seven days ahead, never past the role that carries it
        rule: >
          min(add_days(today(), 7),
              coalesce(student_role_valid_until, open_ended),
              coalesce(employee_role_valid_until, open_ended))
    # ROUND TWO. A payload rule may read a derived field; a derived rule may not.
    # That is the whole difference between the two sections, and it is why an
    # encoding for a terminal belongs here: it is assembled from values that
    # themselves had to be computed.
    payloads:
      nfc_payload:
        kinds: [STRING, NFC]
        description: What a terminal reads over NFC
        # `format_date` takes a NAMED pattern, not a strftime format, and an
        # unknown name fails at startup rather than on a pass.
        rule: >
          concat(home_organization, ':',
                 format_date(pass_valid_until, 'YYYYMMDD'))
