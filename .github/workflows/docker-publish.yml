name: Publish container image

# Publishes the service image to the GitHub Container Registry.
#
# The image name follows the repository name (`github.repository`), so a
# repository rename carries the image with it and no name is duplicated here.
# That property matters: the packages under the pre-rename names are stale by
# design, and nothing in this file has to be touched when a repository moves.

on:
  push:
    branches: ["main"]
    # Date versions, not semver: this is a SERVICE. The house convention splits
    # on the kind of artefact -- a service is deployed and pinned by the date it
    # was built, a library is depended upon and needs an ordered version.
    #
    # The trigger used to be `v*.*.*`, and no such tag was ever cut. The registry
    # therefore held `latest`, `main` and `sha-*` and nothing a deployment could
    # honestly pin: `latest@sha256:...` answers "which build is this?" with a
    # lookup instead of a label. Measured on 2026-09-09 while pinning the
    # reference deployment.
    tags: ["20[0-9][0-9]-[0-1][0-9]-[0-3][0-9]_[0-2][0-9][0-5][0-9]"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A second push to the same branch supersedes the first; a half-finished build
# of an outdated commit is never worth the runner minutes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: a fork must not be able to push an image.
      # The build itself still runs, so a broken Dockerfile fails the review.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only ever points at main. Deployments that pin a version
          # use the date tag; the sha tag is the unambiguous fallback.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # `type=ref,event=tag` takes the tag name VERBATIM, which is what a
            # date version needs. THE TRIGGER ABOVE IS NOT ENOUGH ON ITS OWN:
            # with the `type=semver` rules that stood here, a tag like
            # 2026-09-09_2030 would produce NOTHING -- and would do so silently.
            # The run goes green and pushes only `sha-<...>`; the registry then
            # answers `not found` to whoever tries to pin it. Three sibling
            # repositories learned this the expensive way on 2026-08-30.
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
