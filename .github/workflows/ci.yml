name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nothing in this repository is locked: uv.lock is git-ignored, every requirement
  # is a lower bound, and edutap.db_definitions is a direct reference to a moving
  # branch. A suite that passed on the last commit can therefore fail a week later
  # with nothing changed here. Weekly, Monday morning UTC, on main only — the run
  # that turns "some dependency broke us" from a discovery during the next piece of
  # work into a mail on a Monday.
  schedule:
    - cron: "17 5 * * 1"
# Every Python job installs into a uv virtual environment and calls the interpreter
# inside it by path. Not `uv pip install --system`, which is what these jobs did
# until now and why CI had never once been green: the runner's system interpreter is
# Debian's, marked EXTERNALLY-MANAGED, so uv refuses it outright — and for the matrix
# entries the runner has no system interpreter at all ("No system Python installation
# found for Python 3.14"). Not `uv run` either, for the reason the Makefile gives:
# this package declares an entry point group that uv resolves against the whole
# environment, and a bare `uv run` can fail where sibling eduTAP packages are absent.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -v
  integration:
    # The default run excludes these (addopts), so without this job the
    # database-backed behaviour would never be exercised in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -m integration -v
  shutdown:
    # The default run excludes these too (addopts), the same as integration
    # above -- but unlike integration, nothing else in this file used to run
    # them, which is exactly how a real regression got past review once already:
    # an unreachable OTLP collector blocked process shutdown for ~20s (measured),
    # long enough to turn an orchestrator's SIGTERM into a SIGKILL. The fix pins
    # OTEL_EXPORTER_OTLP_TIMEOUT and friends so shutdown clears in ~6s instead,
    # and this is the only thing that keeps that pin from silently rotting the
    # next time someone edits install_observability. Do not delete this as a
    # slow nuisance: it measured 6.6s the last time someone checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -m slow -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests
      - run: .venv/bin/python -m ruff format --check src tests
      - run: .venv/bin/python -m ty check src
  image:
    # The test jobs above never build the image, so until this job existed a base
    # image bump was green in CI and broken on deployment: the Dockerfile copies
    # /usr/local/lib/python3.14/site-packages out of the build stage by name, and a
    # newer python:*-slim moves it. The build then fails here, in the pull request
    # that proposes the bump, which is the whole point of running it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t edutap-data-provider:ci .
      # Building proves the COPY paths resolved. Importing proves they resolved to
      # the package, rather than to a directory that merely exists.
      - run: docker run --rm edutap-data-provider:ci python -c "import edutap.data_provider"
